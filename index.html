<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CritiRead — tanqidiy fikrlash platformasi</title>
<meta name="description" content="CTDF asosidagi tanqidiy fikrlash o‘lchov platformasi: 30 modul, rubrika, diagnostik test, CT-profil va statistika.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --canvas:#ffffff; --band:#fafafb; --card:#f2f2f3; --hover:#ededee;
  --ink:#17191c; --slate:#5d616b; --ash:#7d808a; --smoke:#a3a6af;
  --line:#ececec; --line-2:#dcdce0;
  --peach:#fbe1d1; --brown:#5d2a1a; --brown-soft:#8a4b38;
  --pre-line:#c4c5ca; --ok:#2f6b3f; --ok-bg:#e4f1e7; --bad:#9b2c2c; --bad-bg:#f8e3e1;
  --shadow-float:0 0 0 1px rgba(4,23,43,.05),0 20px 25px -5px rgba(0,0,0,.10),0 8px 10px -6px rgba(0,0,0,.10);
  --r-card:24px; --r-elev:20px; --r-sm:16px; --r-pill:9999px;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --canvas:#141517; --band:#191b1e; --card:#1f2124; --hover:#282b2f;
  --ink:#ececee; --slate:#a6a9b2; --ash:#8b8e98; --smoke:#6f727c;
  --line:#2a2d31; --line-2:#383b41;
  --peach:#3a2a22; --brown:#f0c9b3; --brown-soft:#d3a68e;
  --pre-line:#4b4e56; --ok:#8fd0a0; --ok-bg:#1d3325; --bad:#f0a3a3; --bad-bg:#3a2121;
  --shadow-float:0 0 0 1px rgba(255,255,255,.06),0 20px 25px -5px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.18;margin:0;text-wrap:balance}
h1{letter-spacing:-.022em}h2{letter-spacing:-.016em}h3,h4{letter-spacing:-.011em}
p{margin:0}
a{color:var(--slate);text-underline-offset:3px}
a:hover{color:var(--ink)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
::selection{background:var(--peach);color:var(--brown)}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--canvas);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
[hidden]{display:none!important}

/* ============ TOP BAR / TABS ============ */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(8px)}
.topbar-in{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.brand{display:flex;flex-direction:column;line-height:1;text-decoration:none;color:var(--ink)}
.brand-name{font-family:var(--serif);font-size:23px;letter-spacing:-.02em}
.brand-sub{font-size:12px;color:var(--ash);letter-spacing:.02em;margin-top:3px}
.spacer{flex:1}
.role-switch{display:flex;gap:6px}
.pill-btn{border:1px solid var(--ink);background:transparent;height:36px;padding:0 15px;border-radius:var(--r-pill);font-size:14px;cursor:pointer;transition:.15s}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:var(--canvas)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:16px}
.icon-btn:hover{background:var(--card)}
.tabs{position:sticky;top:65px;z-index:30;background:var(--canvas);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:0;background:transparent;color:var(--slate);cursor:pointer;text-decoration:none;
  padding:13px 14px 11px;font-size:15px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}

/* ============ LAYOUT ============ */
main{max-width:1200px;margin:0 auto;padding:44px 24px 110px;min-height:70vh}
.view{animation:rise .3s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:14px;color:var(--ash)}
.lede{color:var(--slate);max-width:64ch;font-size:19px;line-height:1.5;text-wrap:pretty}
.section-head{margin-bottom:32px;max-width:74ch}
.section-head h2{font-size:clamp(28px,4vw,38px);line-height:1.2;margin:10px 0 12px}
.split{display:grid;gap:28px}
@media(min-width:960px){.split{grid-template-columns:1.12fr .88fr;align-items:start}}
.divider{height:1px;background:var(--line);margin:44px 0}
.crumbs{font-size:14px;color:var(--ash);margin-bottom:18px}
.crumbs a{color:var(--slate)}

/* ============ HERO / HOME ============ */
.hero{display:grid;gap:44px;align-items:center;padding:20px 0 8px}
@media(min-width:900px){.hero{grid-template-columns:1.02fr .98fr}}
.hero h1{font-size:clamp(38px,6vw,62px);line-height:1.12;max-width:15ch;margin:16px 0 20px}
.hero h1 em{font-style:italic}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.methodline{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:24px;font-size:14px;color:var(--ash)}
.methodline b{color:var(--slate);font-weight:500}
.artifact{background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-elev);box-shadow:var(--shadow-float);padding:20px}
.artifact .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.artifact .cap span{font-size:14px;color:var(--ash)}
.artifact .cap b{font-size:20px;font-weight:500}
.parts{border-top:1px solid var(--line)}
.part{display:grid;grid-template-columns:auto 1fr;gap:26px;padding:26px 4px;border-bottom:1px solid var(--line)}
.part .no{font-size:15px;color:var(--ash);padding-top:6px}
.part h3{font-size:24px;margin-bottom:8px}
.part h3 a{color:inherit;text-decoration:none}
.part h3 a:hover{text-decoration:underline}
.part p{color:var(--slate);font-size:17px;max-width:74ch}
.part.key{background:var(--peach);border-radius:var(--r-card);padding:28px 26px;margin:6px 0}
.part.key .no,.part.key h3{color:var(--brown)}
.part.key p{color:var(--brown-soft)}
.tagx{display:inline-block;font-size:13px;color:var(--brown);border:1px solid var(--brown);border-radius:var(--r-pill);padding:3px 12px;margin-bottom:11px}
.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:6px}
.step{background:var(--card);border-radius:var(--r-sm);padding:20px}
.step b{font-family:var(--serif);font-size:30px;font-weight:400;color:var(--brown)}
.step h4{font-size:18px;margin:6px 0 4px}
.step p{font-size:14.5px;color:var(--slate)}

/* ============ BUTTONS / FORM ============ */
.btn-primary{background:var(--ink);color:var(--canvas);border:1px solid var(--ink);border-radius:var(--r-pill);padding:0 22px;height:44px;font-size:15px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;text-decoration:none}
.btn-primary:hover{opacity:.88;color:var(--canvas)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--ink);color:var(--ink);border-radius:var(--r-pill);padding:0 22px;height:44px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.btn-ghost:hover{background:var(--card);color:var(--ink)}
.btn-ghost:disabled{opacity:.35;cursor:not-allowed}
label.fld{display:block;font-size:13px;color:var(--slate);margin-bottom:7px}
select,input.num,textarea{font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--canvas);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 13px;width:100%}
textarea{min-height:200px;resize:vertical;line-height:1.55}
select:focus,input.num:focus,textarea:focus{border-color:var(--ink);outline:none}
.note{font-size:13px;color:var(--ash);line-height:1.5}

/* ============ MODULES ============ */
.progress-line{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.progress-line .bar{flex:1;min-width:160px;height:8px;background:var(--card);border-radius:var(--r-pill);overflow:hidden}
.progress-line .bar i{display:block;height:100%;background:var(--brown);border-radius:var(--r-pill);transition:width .4s}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.fbtn{border:1px solid var(--line-2);background:var(--canvas);color:var(--slate);border-radius:var(--r-pill);padding:8px 16px;font-size:14px;cursor:pointer}
.fbtn:hover{color:var(--ink);border-color:var(--ink)}
.fbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.search{max-width:340px;margin-bottom:24px}
.mod-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(256px,1fr))}
.mod{background:var(--card);border-radius:var(--r-sm);padding:18px 19px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);transition:background .15s;position:relative}
.mod:hover{background:var(--hover);color:var(--ink)}
.mod-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.mod-n{color:var(--ash)}
.mod-flag{color:var(--brown)}
.mod h4{font-size:19px;line-height:1.2}
.mod .uz{font-size:13.5px;color:var(--slate)}
.mod .type{font-size:13px;color:var(--ash)}
.badges{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:auto;padding-top:6px;font-size:13px;color:var(--ash)}
.done-mark{position:absolute;right:14px;bottom:14px;width:22px;height:22px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:13px;font-weight:600}

/* module detail */
.mod-hero{margin-bottom:30px}
.mod-hero h2{font-size:clamp(30px,4.5vw,44px);margin:10px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:13px;border:1px solid var(--line-2);border-radius:var(--r-pill);padding:4px 12px;color:var(--slate)}
.chip.core{border-color:var(--brown);color:var(--brown)}
.blocks{display:grid;gap:16px}
@media(min-width:900px){.blocks{grid-template-columns:1fr 1fr}.blocks .wide{grid-column:1/-1}}
.block{background:var(--card);border-radius:var(--r-card);padding:24px}
.block h3{font-size:20px;margin-bottom:10px}
.block ul{margin:0;padding-left:20px;color:var(--slate)}
.block li{margin:6px 0}
.block p{color:var(--slate)}
.example{border-left:3px solid var(--brown);padding:2px 0 2px 16px;font-family:var(--serif);font-size:18px;color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}

/* quiz */
.q-opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--canvas);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;margin-top:9px;cursor:pointer;font-size:15px;line-height:1.45}
.q-opt:hover:not(:disabled){border-color:var(--ink)}
.q-opt:disabled{cursor:default}
.q-opt .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12.5px;font-weight:500}
.q-opt.sel{border-color:var(--ink)}
.q-opt.right{background:var(--ok-bg);border-color:var(--ok)}
.q-opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.q-why{margin-top:14px;font-size:14.5px;color:var(--slate);background:var(--canvas);border-radius:12px;padding:12px 14px}
.q-text{font-size:17px;color:var(--ink)}
.q-passage{font-family:var(--serif);font-size:17.5px;border-left:3px solid var(--line-2);padding-left:14px;margin:0 0 14px;color:var(--ink)}

/* ============ PANELS / RUBRIC ============ */
.panel{background:var(--card);border-radius:var(--r-card)}
.panel.plain{background:var(--canvas);border:1px solid var(--line)}
.pad{padding:24px}
.grid2{display:grid;gap:16px}
@media(min-width:520px){.grid2{grid-template-columns:1fr 1fr}}
.rubric-crit{background:var(--card);border-radius:var(--r-sm);overflow:hidden;margin-bottom:12px}
.rubric-crit summary{list-style:none;cursor:pointer;padding:15px 17px;display:flex;align-items:center;gap:13px}
.rubric-crit summary::-webkit-details-marker{display:none}
.crit-idx{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--canvas);font-weight:500;font-size:13px}
.crit-name{font-weight:500;font-size:15px}
.crit-en{color:var(--ash);font-size:13px}
.crit-score{margin-left:auto;font-size:13px;color:var(--slate);background:var(--canvas);border-radius:8px;padding:4px 10px;min-width:52px;text-align:center}
.levels{display:grid;gap:8px;padding:0 17px 16px}
@media(min-width:620px){.levels{grid-template-columns:1fr 1fr}}
.lvl{display:flex;gap:10px;background:var(--canvas);border:1px solid transparent;border-radius:12px;padding:11px 13px;cursor:pointer;font-size:13.5px;position:relative}
.lvl:hover{background:var(--hover)}
.lvl input{position:absolute;opacity:0;pointer-events:none}
.lvl .tag{font-size:12.5px;flex:none;width:46px;color:var(--ash)}
.lvl .desc{color:var(--slate);line-height:1.4}
.lvl:has(input:checked){border-color:var(--ink)}
.lvl:has(input:checked) .tag,.lvl:has(input:checked) .desc{color:var(--ink)}
.lvl:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.result{position:sticky;top:130px}
.result-card{background:var(--peach);border-radius:var(--r-card);padding:26px}
.result-card .rl{font-size:14px;color:var(--brown-soft)}
.bignum{font-family:var(--serif);font-size:64px;line-height:1;letter-spacing:-.03em;color:var(--brown)}
.gradepill{display:inline-flex;align-items:center;font-weight:500;font-size:14px;padding:6px 15px;border-radius:var(--r-pill)}
.gr5{background:var(--ink);color:var(--canvas)}
.gr4{background:#5b5e66;color:#fff}
.gr3{background:#d9d9dc;color:#17191c}
.gr2{background:#ececed;color:#5d616b}
.meter{height:8px;border-radius:var(--r-pill);background:rgba(128,80,60,.2);overflow:hidden;margin:16px 0 6px}
.meter>i{display:block;height:100%;border-radius:var(--r-pill);background:var(--brown);transition:width .5s}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-top:1px solid rgba(128,80,60,.2);color:var(--brown-soft)}
.kv b{font-weight:500;color:var(--brown)}

/* essay tool */
.wc{display:flex;justify-content:space-between;font-size:13px;color:var(--ash);margin-top:8px}
.checks{display:grid;gap:8px;margin-top:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--slate)}
.check .dot{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11px;margin-top:2px}
.check.ok{color:var(--ink)}
.check.ok .dot{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}

/* ============ PROFILE / RADAR ============ */
.radar-wrap{width:100%;max-width:420px;margin:2px auto}
.radar-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.skill-list{display:flex;flex-direction:column;gap:15px}
.skill-row{display:grid;grid-template-columns:1fr auto;gap:7px 12px;align-items:center}
.skill-row .nm{font-size:15px}
.skill-row .nm em{color:var(--ash);font-style:normal;font-size:13px}
.skill-row .val{font-size:14px;font-weight:500}
.dualbar{grid-column:1/-1;height:7px;border-radius:var(--r-pill);background:var(--canvas);position:relative;overflow:hidden}
.dualbar .pre,.dualbar .now{position:absolute;inset:0 auto 0 0;height:100%;border-radius:var(--r-pill)}
.dualbar .pre{background:var(--pre-line)}
.dualbar .now{background:var(--brown)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--slate);margin-top:16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.advice{margin-top:18px;padding:16px 18px;background:var(--canvas);border-radius:14px;font-size:14.5px;color:var(--slate)}
.advice b{color:var(--ink)}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.tile{background:var(--card);border-radius:var(--r-sm);padding:18px 19px}
.tile .lab{font-size:13.5px;color:var(--slate)}
.tile .big{font-size:30px;font-weight:500;margin-top:8px;line-height:1}
.tile .sub{font-size:13px;color:var(--ash);margin-top:6px}
.tile.hl{background:var(--peach)}
.tile.hl .lab,.tile.hl .sub{color:var(--brown-soft)}
.tile.hl .big{color:var(--brown)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--canvas)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--ash);font-weight:400;background:var(--canvas)}
th button{background:none;border:0;cursor:pointer;color:inherit;font-size:inherit;padding:0}
th button:hover{color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--band)}
tr.avg{background:var(--peach)}
tr.avg td{font-weight:500;color:var(--brown)}
.gpill{font-weight:500;padding:3px 10px;border-radius:var(--r-pill);font-size:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--canvas);padding:11px 20px;border-radius:var(--r-pill);font-size:14px;box-shadow:var(--shadow-float);opacity:0;pointer-events:none;transition:.3s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{border-top:1px solid var(--line);color:var(--ash);font-size:13px}
footer div{max-width:1200px;margin:0 auto;padding:22px 24px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.locked{text-align:center;padding:60px 20px;color:var(--slate)}
@media(max-width:600px){main{padding:30px 16px 90px}.topbar-in{padding:12px 16px}.brand-sub{display:none}.part{gap:14px}.tabs{top:61px}}
@media print{.topbar,.tabs,footer,.hero-cta,.pager,.no-print{display:none!important}main{padding:0}body{background:#fff;color:#000}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#app">Asosiy mazmunga o‘tish</a>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/"><span class="brand-name">CritiRead</span><span class="brand-sub">CTDF · Reading &amp; Writing</span></a>
    <div class="spacer"></div>
    <div class="role-switch" id="roleSwitch" role="group" aria-label="Rol">
      <button class="pill-btn" data-role="student" aria-pressed="true">Talaba</button>
      <button class="pill-btn" data-role="teacher" aria-pressed="false">O‘qituvchi</button>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Mavzuni almashtirish" title="Yorug‘ / qorong‘i">◐</button>
  </div>
</header>
<nav class="tabs" aria-label="Bo‘limlar"><div class="tabs-in" id="tabs"></div></nav>

<main id="app" tabindex="-1"></main>

<footer><div><span>CritiRead · DSc dissertatsiyasi amaliy-eksperimental komponenti</span><span>Demo ma’lumotlar · natijalar shu brauzerda saqlanadi</span></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ DATA ============ */
var SKILLS=[{k:"Talqin",en:"interpretation"},{k:"Tahlil",en:"analysis"},{k:"Baholash",en:"evaluation"},
 {k:"Xulosa",en:"inference"},{k:"Izohlash",en:"explanation"},{k:"O‘z-o‘zini boshqarish",en:"self-regulation"}];

/* ============ HELPERS ============ */
var $=function(s,r){return(r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function mean(a){return a.reduce(function(x,y){return x+y;},0)/a.length;}
function grade(p){return p>=90?5:p>=70?4:p>=60?3:2;}
function gradeCls(g){return g===5?"gr5":g===4?"gr4":g===3?"gr3":"gr2";}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},2400);}
function isCore(m){return !!CORE[m.type];}
function stuOptions(sel){return STUDENTS.map(function(s){return '<option value="'+s.id+'"'+(s.id===sel?" selected":"")+'>'+esc(s.name)+' — '+s.group+'</option>';}).join("");}

  document.documentElement.setAttribute("data-theme",t);
}

/* SVG radar */
function radarSVG(series,size){
  size=size||360;var c=size/2,R=size/2-58,n=6,rings=[20,40,60,80,100];
  function pt(i,v){var a=-Math.PI/2+i*2*Math.PI/n;return[c+R*v/100*Math.cos(a),c+R*v/100*Math.sin(a)];}
  var g='';
  rings.forEach(function(r){g+='<polygon points="'+SKILLS.map(function(_,i){return pt(i,r).join(",");}).join(" ")+'" fill="none" stroke="var(--line-2)" stroke-width="1"/>';});
  SKILLS.forEach(function(_,i){var p=pt(i,100);g+='<line x1="'+c+'" y1="'+c+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--line)" />';});
  rings.forEach(function(r){var p=pt(0,r);g+='<text x="'+(p[0]+4)+'" y="'+(p[1]+3)+'" font-size="9" fill="var(--smoke)">'+r+'</text>';});
  series.forEach(function(s){
    var pts=s.vals.map(function(v,i){return pt(i,v).join(",");}).join(" ");
    g+='<polygon points="'+pts+'" fill="'+(s.fill||"none")+'" stroke="'+s.color+'" stroke-width="'+(s.w||2)+'"'+(s.dash?' stroke-dasharray="5 4"':'')+' stroke-linejoin="round"/>';
    if(!s.dash)s.vals.forEach(function(v,i){var p=pt(i,v);g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.4" fill="'+s.color+'"><title>'+SKILLS[i].k+': '+v+'%</title></circle>';});
  });
  SHORT.forEach(function(l,i){var a=-Math.PI/2+i*2*Math.PI/n,x=c+(R+22)*Math.cos(a),y=c+(R+22)*Math.sin(a);
    var anc=Math.abs(Math.cos(a))<.25?"middle":(Math.cos(a)>0?"start":"end");
    g+='<text x="'+x+'" y="'+(y+4)+'" font-size="12" text-anchor="'+anc+'" fill="var(--slate)" font-family="Inter,sans-serif">'+l+'</text>';});
  return '<svg viewBox="0 0 '+size+' '+size+'" role="img" aria-label="CT-profil radar diagrammasi">'+g+'</svg>';
}

/* diagnostik test */
var testState=null;
function viewTest(){
  var html='<div class="section-head"><div class="eyebrow">Facione 6 ko‘nikma · CCTST ruhida</div><h2>Diagnostik test</h2>'+
   '<p class="lede">12 savol, har ko‘nikmadan 2 tadan. Natija CT-profilga yoziladi. Taxminan 8–10 daqiqa.</p></div><div id="testRoot"></div>';
  return{html:html,title:"Diagnostik test",after:function(){
    if(!testState)testState={i:0,ans:[],fin:false};
    drawTest();}};
}
function drawTest(){
  var root=$("#testRoot"),T=testState;
  if(T.fin){return drawTestResult(root);}
  var q=TEST[T.i],L=["A","B","C","D"];
  var pc=Math.round(T.i/TEST.length*100);
  root.innerHTML='<div class="split"><div class="panel pad">'+
   '<div class="progress-line"><span class="tnum note">Savol '+(T.i+1)+' / '+TEST.length+'</span><div class="bar"><i style="width:'+pc+'%"></i></div></div>'+
   (q.p?'<p class="q-passage">'+q.p+'</p>':'')+'<p class="q-text">'+q.t+'</p>'+
   q.o.map(function(o,i){return '<button class="q-opt'+(T.ans[T.i]===i?" sel":"")+'" data-i="'+i+'"><span class="k">'+L[i]+'</span><span>'+esc(o)+'</span></button>';}).join("")+
   '<div class="pager"><button class="btn-ghost" id="tPrev"'+(T.i?"":" disabled")+'>← Oldingi</button>'+
   '<button class="btn-primary" id="tNext"'+(T.ans[T.i]===undefined?" disabled":"")+'>'+(T.i===TEST.length-1?"Yakunlash":"Keyingi →")+'</button></div></div>'+
   '<div class="panel pad"><h3 style="font-size:20px;margin-bottom:10px">Ko‘rsatma</h3><ul class="note" style="padding-left:18px;line-height:1.7"><li>Har savolda bitta to‘g‘ri javob bor.</li><li>Javobni o‘zgartirish mumkin.</li><li>Natija bahoga kirmaydi, faqat profil uchun.</li></ul></div></div>';
  $$(".q-opt",root).forEach(function(b){b.addEventListener("click",function(){T.ans[T.i]=+b.dataset.i;drawTest();});});
  $("#tPrev").addEventListener("click",function(){T.i--;drawTest();});
  $("#tNext").addEventListener("click",function(){if(T.i===TEST.length-1){T.fin=true;}else{T.i++;}drawTest();window.scrollTo(0,0);});
}
function testScores(){
  var sc=[0,0,0,0,0,0],mx=[0,0,0,0,0,0];
  TEST.forEach(function(q,i){mx[q.s]++;if(testState.ans[i]===q.a)sc[q.s]++;});
  return sc.map(function(v,i){return Math.round(v/mx[i]*100);});
}
var TIPS=["Matn mazmuni va yashirin ma’noni sekin o‘qib, o‘z so‘zingiz bilan ayting (3, 17-modullar).","Da’vo, dalil va faktni ajratishga mashq qiling (5, 10-modullar).","Manbani mezon bilan baholang (23, 26, 27-modullar).","Dalildan nimaga xulosa chiqarilishini, muqobil tushuntirishlarni o‘ylang (10, 21-modullar).","Tezis + dalil + izoh (CEE) tuzilmasida yozing (6–8-modullar).","Fikr-mulohazadan so‘ng matnni qayta ishlang (9, 29-modullar)."];
function drawTestResult(root){
  var p=testScores(),ov=Math.round(mean(p)),weak=p.indexOf(Math.min.apply(null,p));
  var right=testState.ans.filter(function(a,i){return a===TEST[i].a;}).length;
  root.innerHTML='<div class="split"><div class="panel plain pad"><div class="radar-wrap">'+radarSVG([{vals:p,color:"var(--brown)",fill:"rgba(140,80,56,.14)"}],400)+'</div></div>'+
   '<div><div class="tiles" style="margin-bottom:14px"><div class="tile hl"><div class="lab">Umumiy natija</div><div class="big">'+ov+'%</div><div class="sub">baho '+grade(ov)+' · '+right+' / '+TEST.length+' to‘g‘ri</div></div>'+
   '<div class="tile"><div class="lab">Eng zaif ko‘nikma</div><div class="big" style="font-size:20px">'+SKILLS[weak].k+'</div><div class="sub">'+p[weak]+'%</div></div></div>'+
   '<div class="panel pad"><h3 style="font-size:19px;margin-bottom:6px">Ko‘nikmalar kesimi</h3><div class="skill-list" style="margin-top:14px">'+
   SKILLS.map(function(s,i){return '<div class="skill-row"><div class="nm">'+s.k+' <em>'+s.en+'</em></div><div class="val tnum">'+p[i]+'%</div><div class="dualbar"><span class="now" style="width:'+p[i]+'%"></span></div></div>';}).join("")+
   '</div><div class="advice"><b>Tavsiya:</b> '+TIPS[weak]+'</div></div>'+

/* rubrika */
function viewRubric(){
  var task=rubricPreset||"reading";rubricPreset=null;
  var html='<div class="section-head"><div class="eyebrow">Kriterial baholash · Facione 6 × 4</div><h2>Topshiriqni tanqidiy fikrlash mezonlari bo‘yicha baholash</h2>'+
   '<p class="lede">Topshiriq turini tanlang — faqat unga tegishli mezonlar chiqadi. Ball, CT-foizi, baho va talaba CT-profili avtomatik hisoblanadi.</p></div>'+
   '<div class="split"><div><div class="panel pad" style="margin-bottom:18px"><div class="grid2">'+
   '<div><label class="fld" for="stuSel">Talaba</label><select id="stuSel">'+stuOptions(S.stu)+'</select></div>'+
   '<div><label class="fld" for="taskSel">Topshiriq turi</label><select id="taskSel">'+
   [["reading","O‘qish / matn tahlili — mezon 1–4"],["writing","Yozma / esse-insho — mezon 2–6"],["peer","Peer & self-review — 3, 5, 6"],["diagnostic","Diagnostik test — barcha 6"]].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===task?" selected":"")+'>'+o[1]+'</option>';}).join("")+
   '</select></div></div></div><div id="rubricArea"></div>'+
   '<div id="essayTool"></div></div>'+
   '<div class="result"><div class="result-card"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px"><div><div class="rl">CT bahosi</div><div class="bignum" id="pctOut">—</div></div><span class="gradepill gr5" id="gradeOut">baho —</span></div>'+
   '<div class="meter"><i id="meterBar" style="width:0%"></i></div>'+
   '<div class="kv"><span>To‘plangan ball</span><b id="sumOut">0</b></div><div class="kv"><span>Maksimal ball</span><b id="maxOut">0</b></div><div class="kv"><span>Baholangan mezon</span><b id="critOut">0</b></div>'+
   '<div style="margin-top:18px;display:flex;gap:10px"><button class="btn-primary" id="applyBtn" style="flex:1">Profilga qo‘llash</button><button class="btn-ghost" id="resetBtn">Tozalash</button></div>'+
   '<p class="note" style="margin-top:13px;color:var(--brown-soft)">CT% = (ball ÷ maks) × 100 · 90–100 → 5 · 70–89 → 4 · 60–69 → 3 · 0–59 → 2.</p></div></div></div>';
  return{html:html,title:"Topshiriq baholash",after:function(){
    $("#stuSel").addEventListener("change",function(){S.stu=this.value;save();});
    $("#taskSel").addEventListener("change",drawRubric);
    $("#resetBtn").addEventListener("click",drawRubric);
    $("#rubricArea").addEventListener("change",compute);
    $("#applyBtn").addEventListener("click",function(){
      var applied=0,stu=getStu(S.stu);
      $$("#rubricArea details").forEach(function(d){
        var c=$("input:checked",d);if(!c)return;
        var ci=+d.dataset.ci,pp=PTS[c.value]/5*100,oc=stu.count[ci],ov=stu.cur[ci];
        stu.cur[ci]=Math.round((ov*oc+pp)/(oc+1));stu.count[ci]=oc+1;applied++;});
      if(!applied){toast("Avval mezonlarni belgilang");return;}
      save();toast(stu.name+" — profil yangilandi ("+applied+" mezon)");});
    drawRubric();
  }};
}
function drawRubric(){
  var task=$("#taskSel").value,ids=TASKS[task],area=$("#rubricArea");
  area.innerHTML=ids.map(function(ci){var c=CRIT[ci];
    return '<details class="rubric-crit" open data-ci="'+ci+'"><summary><span class="crit-idx">'+(ci+1)+'</span><span><span class="crit-name">'+c.name+'</span> <span class="crit-en">'+c.en+'</span></span><span class="crit-score" data-score>—</span></summary><div class="levels">'+
     ["A","B","C","D"].map(function(L){return '<label class="lvl"><input type="radio" name="c'+ci+'" value="'+L+'"><span class="tag">'+(L==="D"?"D · 1–2":L+" · "+PTS[L])+'</span><span class="desc">'+c[L]+'</span></label>';}).join("")+'</div></details>';}).join("");
  var et=$("#essayTool");
  if(task==="writing"){
    et.innerHTML='<div class="panel pad" style="margin-top:18px"><h3 style="font-size:20px;margin-bottom:10px">Esse yozish va o‘z-o‘zini tekshirish</h3>'+
     '<p class="note" style="margin-bottom:10px">Matnni shu yerga yozing — tuzilma belgilari avtomatik tekshiriladi (matn saqlanmaydi).</p>'+
     '<label class="fld" for="essay">Esse matni</label><textarea id="essay" placeholder="Thesis, evidence, counter-argument, conclusion…"></textarea>'+
     '<div class="wc"><span id="wcWords">0 so‘z</span><span id="wcSent">0 gap</span></div><div class="checks" id="essayChecks"></div></div>';
    $("#essay").addEventListener("input",essayCheck);essayCheck();
  }else et.innerHTML="";
  compute();
}
function essayCheck(){
  var t=$("#essay").value,words=(t.trim().match(/\S+/g)||[]).length,sent=(t.match(/[^.!?]+[.!?]+/g)||[]).length;
  $("#wcWords").textContent=words+" so‘z";$("#wcSent").textContent=sent+" gap";
  var low=t.toLowerCase();
  var items=[
   ["Yetarli hajm (150+ so‘z)",words>=150],
   ["Tezis belgisi (argue, claim, believe, thesis, should)",/\b(argue|claim|believe|thesis|should|must|i think|in my opinion)\b/.test(low)],
   ["Dalil keltirilgan (study, data, research, according to, %)",/\b(study|studies|data|research|according to|evidence|survey)\b|%/.test(low)],
   ["Qarshi fikr (however, critics, although, on the other hand)",/\b(however|critics|although|on the other hand|opponents)\b/.test(low)],
   ["Xulosa (in conclusion, therefore, thus, overall)",/\b(in conclusion|therefore|thus|overall|to sum up)\b/.test(low)]
  ];
  $("#essayChecks").innerHTML=items.map(function(i){return '<div class="check'+(i[1]?" ok":"")+'"><span class="dot">'+(i[1]?"✓":"")+'</span><span>'+i[0]+'</span></div>';}).join("");
}
function compute(){
  var det=$$("#rubricArea details"),sum=0,max=0,n=0;
  det.forEach(function(d){max+=5;var c=$("input:checked",d),sc=$("[data-score]",d);
    if(c){var p=PTS[c.value];sum+=p;n++;sc.textContent=p+" / 5";sc.style.color="var(--ink)";}else{sc.textContent="—";sc.style.color="var(--slate)";}});
  var pct=max?Math.round(sum/max*100):0;
  $("#sumOut").textContent=sum;$("#maxOut").textContent=max;$("#critOut").textContent=n+" / "+det.length;
  if(!n){$("#pctOut").textContent="—";$("#meterBar").style.width="0%";$("#gradeOut").textContent="baho —";$("#gradeOut").className="gradepill gr5";return;}
  var g=grade(pct);
  $("#pctOut").textContent=pct+"%";$("#meterBar").style.width=pct+"%";$("#gradeOut").textContent="baho "+g;$("#gradeOut").className="gradepill "+gradeCls(g);
}

/* statistika */
function viewStats(){
  var html='<div class="section-head"><div class="eyebrow">O‘qituvchi paneli</div><h2>Guruh statistikasi — ko‘nikmalar bo‘yicha kesim</h2>'+
   '<p class="lede">Har talabaning 6 ko‘nikma bo‘yicha joriy foizi, umumiy CT darajasi va bahosi. Ustun sarlavhasini bosib saralang.</p></div>'+
   '<div class="tiles" id="statTiles" style="margin-bottom:20px"></div>'+
   '<div class="hero-cta no-print" style="margin:0 0 16px"><button class="btn-ghost" id="csvBtn">CSV yuklab olish</button><button class="btn-ghost" id="resetData">Demo ma’lumotni tiklash</button></div>'+
   '<div class="tbl-wrap"><table id="statTable"><thead><tr id="statHead"></tr></thead><tbody id="statBody"></tbody></table></div>';
  return{html:html,title:"Statistika",after:function(){
    var cols=[{k:"name",l:"Talaba"},{k:"group",l:"Guruh"}].concat(SHORT.map(function(s,i){return{k:"c"+i,l:s,n:1};})).concat([{k:"ov",l:"Umumiy",n:1},{k:"g",l:"Baho"}]);
    function val(s,k){if(k==="name")return s.name;if(k==="group")return s.group;if(k==="ov"||k==="g"){var o=Math.round(mean(s.cur));return k==="ov"?o:grade(o);}return s.cur[+k.slice(1)];}
    function draw(){
      $("#statHead").innerHTML=cols.map(function(c){var a=S.sort.k===c.k?(S.sort.d>0?" ▲":" ▼"):"";
        return '<th'+(c.n?' class="num"':'')+' aria-sort="'+(S.sort.k===c.k?(S.sort.d>0?"ascending":"descending"):"none")+'"><button data-k="'+c.k+'">'+c.l+a+'</button></th>';}).join("");
      var rows=STUDENTS.slice().sort(function(a,b){var x=val(a,S.sort.k),y=val(b,S.sort.k);return (x>y?1:x<y?-1:0)*S.sort.d;});
      var sums=[0,0,0,0,0,0],ovs=[];
      var body=rows.map(function(s){var ov=Math.round(mean(s.cur));ovs.push(ov);var g=grade(ov);
        return '<tr><td>'+esc(s.name)+'</td><td>'+s.group+'</td>'+s.cur.map(function(v,i){sums[i]+=v;return '<td class="num">'+v+'</td>';}).join("")+'<td class="num"><b>'+ov+'%</b></td><td><span class="gpill '+gradeCls(g)+'">'+g+'</span></td></tr>';}).join("");
      var avg=sums.map(function(x){return Math.round(x/STUDENTS.length);}),ao=Math.round(mean(ovs));
      $("#statBody").innerHTML=body+'<tr class="avg"><td>Guruh o‘rtachasi</td><td>n='+STUDENTS.length+'</td>'+avg.map(function(v){return '<td class="num">'+v+'</td>';}).join("")+'<td class="num">'+ao+'%</td><td><span class="gpill '+gradeCls(grade(ao))+'">'+grade(ao)+'</span></td></tr>';
      var order=avg.map(function(v,i){return{i:i,v:v};}).sort(function(a,b){return a.v-b.v;}),weak=order[0],strong=order[5];
      var gr={2:0,3:0,4:0,5:0};ovs.forEach(function(o){gr[grade(o)]++;});
      $("#statTiles").innerHTML=[
        {lab:"Guruh CT darajasi",big:ao+"%",sub:"o‘rtacha baho "+grade(ao),hl:1},
        {lab:"Eng kuchli ko‘nikma",big:SKILLS[strong.i].k,sub:strong.v+"%"},
        {lab:"Eng zaif ko‘nikma",big:SKILLS[weak.i].k,sub:weak.v+"% — e’tibor talab"},
        {lab:"Baholar (5 / 4 / 3 / 2)",big:gr[5]+" / "+gr[4]+" / "+gr[3]+" / "+gr[2],sub:STUDENTS.length+" talaba"}
      ].map(function(x){return '<div class="tile'+(x.hl?" hl":"")+'"><div class="lab">'+x.lab+'</div><div class="big" style="font-size:'+(String(x.big).length>5?"20px":"30px")+'">'+x.big+'</div><div class="sub">'+x.sub+'</div></div>';}).join("");
      $$("#statHead button").forEach(function(b){b.addEventListener("click",function(){S.sort={k:b.dataset.k,d:S.sort.k===b.dataset.k?-S.sort.d:1};draw();});});
    }
    draw();
    $("#csvBtn").addEventListener("click",function(){
      var head=["Talaba","Guruh"].concat(SKILLS.map(function(s){return s.k;})).concat(["Umumiy","Baho"]);
      var lines=[head].concat(STUDENTS.map(function(s){var o=Math.round(mean(s.cur));return[s.name,s.group].concat(s.cur).concat([o,grade(o)]);}));
      var csv="﻿"+lines.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
      var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="critiread-statistika.csv";a.click();URL.revokeObjectURL(a.href);
    });
    $("#resetData").addEventListener("click",function(){if(confirm("Barcha saqlangan natijalar o‘chirilsinmi?"))resetAll();});
  }};
}

/* tadqiqot: Cohen's d */
function cohensD(preM,preSD,postM,postSD){var p=Math.sqrt((preSD*preSD+postSD*postSD)/2);return p===0?0:(postM-preM)/p;}
function interp(d){var a=Math.abs(d);return a>=0.8?"kuchli ta’sir":a>=0.5?"o‘rta ta’sir":a>=0.2?"kichik ta’sir":"juda kichik";}
function viewResearch(){
  function inp(id,v){return '<input class="num" id="'+id+'" inputmode="decimal" value="'+v+'" aria-label="'+id+'">';}
  var html='<div class="section-head"><div class="eyebrow">Eksperimental o‘lchov · 15 &amp; 30-modul</div><h2>Diagnostik test va samaradorlik (Cohen’s d)</h2>'+
   '<p class="lede">Pre/post natijalar solishtiriladi. Cohen’s d — eksperiment ta’sir kuchini o‘lchaydigan standart ko‘rsatkich. Qiymatlarni tahrirlang — natija darhol qayta hisoblanadi.</p></div>'+
   '<div class="split"><div class="panel pad"><h3 style="font-size:20px;margin-bottom:18px">Guruh natijalari (o‘rtacha / SD, n)</h3><div class="grid2" style="gap:18px">'+
   '<div><div class="eyebrow" style="color:var(--slate)">Eksperimental guruh</div><label class="fld" style="margin-top:12px">Pre — o‘rtacha / SD</label><div style="display:flex;gap:9px">'+inp("ePreM",52.4)+inp("ePreSD",9.1)+'</div>'+
   '<label class="fld" style="margin-top:12px">Post — o‘rtacha / SD</label><div style="display:flex;gap:9px">'+inp("ePostM",71.8)+inp("ePostSD",8.3)+'</div><label class="fld" style="margin-top:12px">n</label>'+inp("eN",28)+'</div>'+
   '<div><div class="eyebrow">Nazorat guruh</div><label class="fld" style="margin-top:12px">Pre — o‘rtacha / SD</label><div style="display:flex;gap:9px">'+inp("cPreM",51.9)+inp("cPreSD",9.4)+'</div>'+
   '<label class="fld" style="margin-top:12px">Post — o‘rtacha / SD</label><div style="display:flex;gap:9px">'+inp("cPostM",57.2)+inp("cPostSD",9.0)+'</div><label class="fld" style="margin-top:12px">n</label>'+inp("cN",28)+'</div></div></div>'+
   '<div><div class="tiles" style="margin-bottom:14px"><div class="tile hl"><div class="lab">Cohen’s d — eksperimental</div><div class="big" id="dExp">—</div><div class="sub" id="dExpInt">—</div></div>'+
   '<div class="tile"><div class="lab">Cohen’s d — nazorat</div><div class="big" id="dCtl">—</div><div class="sub" id="dCtlInt">—</div></div></div>'+
   '<div class="tile" style="margin-bottom:14px"><div class="lab">Guruhlararo farq (o‘sish farqi)</div><div class="big" id="dBet">—</div><div class="sub" id="dBetInt">—</div></div>'+
   '<div class="panel pad"><h3 style="font-size:19px;margin-bottom:6px">Pre → Post o‘rtacha</h3><div id="prepostBars"></div>'+
   '<p class="note" style="margin-top:16px">d = (M<sub>post</sub> − M<sub>pre</sub>) / SD<sub>pooled</sub>, SD<sub>pooled</sub> = √((SD<sub>pre</sub>² + SD<sub>post</sub>²) / 2). 95% CI ≈ d ± 1.96·√(1/n + d²/2n). |d| ≥ 0.8 — kuchli, 0.5–0.8 — o‘rta, 0.2–0.5 — kichik ta’sir. Guruhlararo farq: (ΔE − ΔC) / SD<sub>pooled</sub>(post).</p></div></div></div>';
  return{html:html,title:"Tadqiqot",after:function(){
    var g=function(id){return parseFloat(String($("#"+id).value).replace(",","."))||0;};
    function ci(d,n){var se=Math.sqrt(1/n+d*d/(2*n));return "95% CI ["+(d-1.96*se).toFixed(2)+"; "+(d+1.96*se).toFixed(2)+"]";}
    function calc(){
      var eD=cohensD(g("ePreM"),g("ePreSD"),g("ePostM"),g("ePostSD")),cD=cohensD(g("cPreM"),g("cPreSD"),g("cPostM"),g("cPostSD"));
      $("#dExp").textContent=eD.toFixed(2);$("#dExpInt").textContent=interp(eD)+" · Δ "+(g("ePostM")-g("ePreM")).toFixed(1)+" p.p. · "+ci(eD,Math.max(g("eN"),2));
      $("#dCtl").textContent=cD.toFixed(2);$("#dCtlInt").textContent=interp(cD)+" · Δ "+(g("cPostM")-g("cPreM")).toFixed(1)+" p.p. · "+ci(cD,Math.max(g("cN"),2));
      var sp=Math.sqrt((g("ePostSD")*g("ePostSD")+g("cPostSD")*g("cPostSD"))/2),dB=sp?((g("ePostM")-g("ePreM"))-(g("cPostM")-g("cPreM")))/sp:0;
      $("#dBet").textContent=dB.toFixed(2);$("#dBetInt").textContent=interp(dB);
      var rows=[["Eksperimental — pre",g("ePreM"),"var(--pre-line)"],["Eksperimental — post",g("ePostM"),"var(--brown)"],["Nazorat — pre",g("cPreM"),"var(--pre-line)"],["Nazorat — post",g("cPostM"),"var(--brown)"]];
      var mx=Math.max.apply(null,rows.map(function(r){return r[1];}))||100;
      $("#prepostBars").innerHTML=rows.map(function(r){return '<div style="display:flex;align-items:center;gap:11px;margin-top:11px"><div style="width:162px;font-size:13.5px;color:var(--slate)">'+r[0]+'</div><div style="flex:1;height:18px;background:var(--card);border-radius:6px;overflow:hidden"><div style="height:100%;width:'+(r[1]/mx*100)+'%;background:'+r[2]+';border-radius:6px"></div></div><div class="tnum" style="width:52px;text-align:right;font-weight:500;font-size:14px">'+r[1].toFixed(1)+'</div></div>';}).join("");
    }
    $$("#app input.num").forEach(function(i){i.addEventListener("input",calc);});calc();
  }};
}
